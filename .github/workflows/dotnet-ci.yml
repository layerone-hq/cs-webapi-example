name: .NET CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            NuGet.Config
            Directory.Packages.props
            src/WebApiDemo.Domain/packages.lock.json
            src/WebApiDemo.Application/packages.lock.json
            src/WebApiDemo.Infrastructure/packages.lock.json
            src/WebApiDemo.WebAPI/packages.lock.json
            tests/WebApiDemo.Tests/packages.lock.json

      - name: Cache SonarQube Cloud packages
        uses: actions/cache@v5
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/sonar-scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ runner.temp }}/sonar-scanner"
          dotnet tool update dotnet-sonarscanner --tool-path "${{ runner.temp }}/sonar-scanner"

      - name: Restore dependencies
        run: dotnet restore webapi-demo.slnx --locked-mode

      - name: Begin SonarQube Cloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          "${{ runner.temp }}/sonar-scanner/dotnet-sonarscanner" begin \
            /k:"layerone-hq_cs-webapi-example" \
            /o:"layerone-hq" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.cobertura.reportsPaths="**/coverage.cobertura.xml"

      - name: Build
        run: dotnet build webapi-demo.slnx --configuration Release --no-restore

      - name: Test with coverage
        run: |
          dotnet test webapi-demo.slnx \
            --configuration Release \
            --no-build \
            --collect:"XPlat Code Coverage" \
            --settings coverlet.runsettings \
            --logger:"console;verbosity=detailed" \
            --results-directory ./TestResults

      - name: Verify coverage report
        run: |
          coverage_file=$(find "$PWD/TestResults" -name "coverage.cobertura.xml" | head -n 1)

          if [ -z "$coverage_file" ]; then
            echo "Coverage report not found."
            exit 1
          fi

      - name: End SonarQube Cloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          "${{ runner.temp }}/sonar-scanner/dotnet-sonarscanner" end \
            /d:sonar.token="$SONAR_TOKEN"

  build-docker-image:
    runs-on: ubuntu-latest
    needs: build-test-publish

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: webapi-demo:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
